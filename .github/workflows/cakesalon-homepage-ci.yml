name: Cake Salon homepage candidate verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'app/inspiration-gallery.tsx'
      - 'app/inspiration-gallery.css'
      - '.github/workflows/cakesalon-homepage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-homepage:
    name: Build & test existing homepage (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use project-compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact lockfile dependencies
        run: npm run install:ci
      - name: Build and run existing rendered HTML tests
        run: npm test
